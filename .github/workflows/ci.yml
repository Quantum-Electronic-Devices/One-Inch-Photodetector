name: "Build manufacturing files"

# Runs on pushes to any branch that touch KiCad/KiBot files, and when a release
# is published.
on:
  push:
    branches:
      - "**"
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - 'KiCAD/footprints.pretty/*'
      - '.github/workflows/*.yml'
      - 'KiCAD/config.kibot.yaml'
      - 'KiCAD/bom.ini'
    # Ignore the push event when creating tags
    tags-ignore:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
  release:
    types:
      - published

# A newer push to the same branch supersedes an older run still in progress.
# Release runs are never cancelled: they upload the assets to the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  create_manufacturing_files:
    permissions:
      contents: write
    strategy:
      matrix:
        project:
          - name: 1-inch-Photodetector
            schematic: 1inch-photodetector.kicad_sch
            pcb: 1inch-photodetector.kicad_pcb
            config: config.kibot.yaml
            variants: '["default"]'
    uses: ./.github/workflows/build-kicad.yml
    with:
      schematic: ${{ matrix.project.schematic }}
      pcb: ${{ matrix.project.pcb }}
      config: ${{ matrix.project.config }}
      name: ${{ matrix.project.name }}
      variants: ${{ matrix.project.variants }}
