name: "Workflow to build manufacturing files of one project"

on:
  workflow_call:
    inputs:
      schematic:
        required: true
        type: string
      pcb:
        required: true
        type: string
      config:
        required: true
        type: string
      name:
        required: true
        type: string
      variants:
        required: true
        type: string
        default: "[ 'default', ]"
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.extract_sch_revision.outputs.value }}
      basename: ${{ steps.repo-basename.outputs.value }}

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse repository name
        id: repo-basename
        run: |
          echo "value=${GITHUB_REPOSITORY##*/}" >> "${GITHUB_OUTPUT}"

      # Only the first match is used; the title_block match is non-greedy so it
      # stops at the first (rev "...") instead of the last one in the file.
      - name: Extract schematic revision
        id: extract_sch_revision
        env:
          SCHEMATIC: ${{ inputs.schematic }}
        run: |
          echo "value=$(perl -0777 -ne 'print $1 if /\(title_block.+?\(rev "(.+?)"\)/s' "${SCHEMATIC}")" >> "${GITHUB_OUTPUT}"

      - name: Extract PCB revision
        id: extract_pcb_revision
        env:
          PCB: ${{ inputs.pcb }}
        run: |
          echo "value=$(perl -0777 -ne 'print $1 if /\(title_block.+?\(rev "(.+?)"\)/s' "${PCB}")" >> "${GITHUB_OUTPUT}"

      - name: Extract PCB revision label
        id: extract_pcb_revision_label
        env:
          PCB: ${{ inputs.pcb }}
        run: |
          echo "value=$(perl -0777 -ne 'print $1 if /\(gr_text ".+\\nVersion: (.+?)(?:\\n|")/' "${PCB}")" >> "${GITHUB_OUTPUT}"

      - name: Test if the revision number was extracted
        if: steps.extract_sch_revision.outputs.value == ''
        env:
          SCHEMATIC: ${{ inputs.schematic }}
        run: |
          echo "::error::Failed to extract revision number from schematic file: '${SCHEMATIC}'"
          exit 1

      - name: Test schematic revision == pcb revision
        if: steps.extract_sch_revision.outputs.value != steps.extract_pcb_revision.outputs.value
        env:
          SCH_REV: ${{ steps.extract_sch_revision.outputs.value }}
          PCB_REV: ${{ steps.extract_pcb_revision.outputs.value }}
        run: |
          echo "::error::Revision number of the schematic (${SCH_REV}) does not match PCB (${PCB_REV}) revision."
          exit 1

      - name: Test revision label == pcb revision
        if: steps.extract_pcb_revision_label.outputs.value != steps.extract_pcb_revision.outputs.value
        env:
          LABEL_REV: ${{ steps.extract_pcb_revision_label.outputs.value }}
          PCB_REV: ${{ steps.extract_pcb_revision.outputs.value }}
        run: |
          echo "::error::Revision number of the PCB label (${LABEL_REV}) does not match PCB (${PCB_REV}) revision."
          exit 1

      - name: Test for correct git tag
        if: github.event.action == 'published' && github.event.release.tag_name != steps.extract_pcb_revision.outputs.value
        env:
          PCB_REV: ${{ steps.extract_pcb_revision.outputs.value }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::error::Revision number of the schematic/PCB (${PCB_REV}) does not match the Github tag (${TAG})."
          exit 1

  ERC:
    name: Run ERC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: tests

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Run ERC
        uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ inputs.config }}
          schema: ${{ inputs.schematic }}
          dir: generated
          skip: drc
          targets: __NONE__  # Only run preflights

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}_ERC_Output
          path: generated
          retention-days: 7

  DRC:
    name: Run DRC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    permissions:
      contents: read

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Run DRC
        uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ inputs.config }}
          board: ${{ inputs.pcb }}
          dir: generated
          skip: erc
          targets: __NONE__  # Only run preflights

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}_DRC_Output
          path: generated
          retention-days: 7

  fabrication_output:
    name: 'Produce fabrication outputs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ERC, DRC]
    permissions:
      contents: read
    strategy:
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ inputs.config }}
          schema: ${{ inputs.schematic }}
          board: ${{ inputs.pcb }}
          skip: erc,drc
          variant: ${{ matrix.variant }}
          verbose: 0  # use 3 for debugging

      - name: Upload bill of materials files as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-manufacturing_files-bom-${{ matrix.variant }}
          path: bom_files_compressed
          if-no-files-found: error
          retention-days: 7

      - name: Upload schematic files as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-manufacturing_files-schematics-${{ matrix.variant }}
          path: schematics
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gerber files as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-manufacturing_files-gerber-${{ matrix.variant }}
          path: gerber_files_compressed
          if-no-files-found: error
          retention-days: 7

  release:
    name: 'Upload manufacturing files to release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests, fabrication_output]
    permissions:
      contents: write
    if: github.event.action == 'published'
    strategy:
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
      PROJECT: ${{ inputs.name }}
      SCHEMATIC: ${{ inputs.schematic }}
      BASENAME: ${{ needs.tests.outputs.basename }}
      REVISION: ${{ needs.tests.outputs.revision }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Download BOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}-manufacturing_files-bom-${{ matrix.variant }}
          path: ${{ inputs.name }}-manufacturing_files

      - name: Download schematics artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}-manufacturing_files-schematics-${{ matrix.variant }}
          path: ${{ inputs.name }}-manufacturing_files

      - name: Download Gerber artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.name }}-manufacturing_files-gerber-${{ matrix.variant }}
          path: ${{ inputs.name }}-manufacturing_files

      - name: Display structure of downloaded files
        run: ls -Rb
        working-directory: ./${{ inputs.name }}-manufacturing_files

      - name: Append BOM (bill of materials) as asset
        run: |
          asset="${PROJECT}_${BASENAME}_bom_${REVISION}_${VARIANT}.zip"
          mv "./${PROJECT}-manufacturing_files/bom_(${VARIANT}).zip" "${asset}"
          gh release upload "${TAG}" "${asset}#${PROJECT}: Bill of materials for the ${VARIANT} variant (zip)" --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Append schematics as asset
        run: |
          asset="${PROJECT}_${BASENAME}_schematics_${REVISION}_${VARIANT}.pdf"
          mv "./${PROJECT}-manufacturing_files/$(basename "${SCHEMATIC}" .kicad_sch)_schematics_${REVISION}_(${VARIANT}).pdf" "${asset}"
          gh release upload "${TAG}" "${asset}#${PROJECT}: Schematics for the ${VARIANT} variant (pdf)" --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Append position files as asset
        run: |
          asset="${PROJECT}_${BASENAME}_position_${REVISION}_${VARIANT}.zip"
          mv "./${PROJECT}-manufacturing_files/pos_(${VARIANT}).zip" "${asset}"
          gh release upload "${TAG}" "${asset}#${PROJECT}: Pick & Place position files for the ${VARIANT} variant (zip)" --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Append Gerber files as asset
        if: matrix.variant == 'default'
        run: |
          asset="${PROJECT}_${BASENAME}_gerber_${REVISION}_all.zip"
          mv "./${PROJECT}-manufacturing_files/gerbers_(${VARIANT}).zip" "${asset}"
          gh release upload "${TAG}" "${asset}#${PROJECT}: Gerber files for all variants (zip)" --repo "${GITHUB_REPOSITORY}" --clobber
