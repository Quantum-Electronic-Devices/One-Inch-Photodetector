name: Update statics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  update-static-files:
    # One run per static source at a time. Not cancelled mid-flight: the job
    # pushes a branch and opens/updates a PR, and aborting that halfway could
    # leave a partial state. A newer run just waits (only one is kept pending).
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.static.repo }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false # one failing source must not cancel the others
      matrix:
        static:
          - {repo: "Quantum-Electronic-Devices/Logos", version_file: ".logo_version"}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update statics
        uses: Quantum-Electronic-Devices/sync_assets@bccccfff05ee074767e961feb2444483c5d1139f # v1.0.1
        with:
          repository: ${{ matrix.static.repo }}
          version_file: ${{ matrix.static.version_file }}
          remote-token: ${{ secrets.QED_LOGO_PA }}
          github-token: ${{ secrets.QED_BOT_PAT }}
          commit-user-name: qed-bot
          commit-user-id: 279461323
